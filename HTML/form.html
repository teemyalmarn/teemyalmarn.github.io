<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Stydent Registration</h1>
    <form action="request.php" method="get">

        <label for="name">Name</label>
        <input type="text" name="stu_name" id="name">
        <br><br>

        <label for="Email">Email</label>
        <input type="email" name="stu_email" id="email">
        <br><br>

        <label for="phone">Phone</label>
        <input type="number" name="stu_number" id="number">
        <br><br>

        <label for="password">password</label>
        <input type="password" name="stu_password" id="password">
        <br><br>

        <label for="dob">Date Of Birth</label>
        <input type="date" name="stu_date" id="date">
        <br><br>

        <label for="passport">Passprot</label>
        <input type="file" accept=".pdf" name="stu_file" id="file">
        <br><br>

        <label for="year">Year</label>
        <select name="stu_year" id="year">
            <option value="">Choose Your Year</option>
            <option value="1">First year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
        </select>
            
        <br><br>

        <label for="">Gender</label>
        <input type="radio" name="gender" id="male" value="male"><label for="male">Male</label>
        
        <input type="radio" name="gender" id="female" value="female"><label for="female">Female</label>
        
        <input type="radio" name="gender" id="other" value="other"><label for="other">Other</label>
        <br><br>

        <label for="">Hobby</label>
        <br><br>

        <input type="checkbox" name="gamming" id="gamming" value="gamming"><label for="">Gamming</label>

        <input type="checkbox" name="reading" id="reading" value="reading"><label for="">Reading</label>

        <input type="checkbox" name="swimming" id="swimming" value="swimming"><label for="">Swimming</label>
        <br><br>
        <label for="address">Address</label>
        <textarea name="address" id="address" cols="50" rows="15"></textarea>
        <br><br>

        <input type="time" name="" id="">
        <input type="range" min="0" max="200" name="" id="">

        <input type="color" name="" id="">
        <input type="text" name="" id="" required>

        <input type="text" name="city1" id="" value="mandalay">

        <input type="text" name="city2" id="" value="Yangon">

        <input type="text" name="plac" id="" placeholder="0000000000">
        <br><br>

        

        <button type="submit">submit</button>
    </form>

</body>
</html>
