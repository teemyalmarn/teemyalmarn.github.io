<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>

    <style>
        #panel{
            max-width: 150px;
            padding: 50px 0;
            background-color: red;
            color: white;
            text-align: center;
            position: relative;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <p id="panel">Animation</p>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <script>
        $(document).ready(function(){
            $('#start').click(function(){
                $('#panel').animate({left:'1200px'}, 3000);
                $('#panel').animate({ top: '480px' }, 3000);
                $('#panel').animate({ left: '0px' }, 3000);
                $('#panel').animate({ top: '100px' }, 3000);
                // 2
                $('#panel').animate({ left: '1100px' }, 3000);
                $('#panel').animate({ top: '400px' }, 3000);
                $('#panel').animate({ left: '100px' }, 3000);
                $('#panel').animate({ top: '160px' }, 3000);
                // 3
                 $('#panel').animate({ left: '1000px' }, 3000);
                $('#panel').animate({ top: '320px' }, 3000);
                $('#panel').animate({ left: '160px' }, 3000);
                $('#panel').animate({ top: '200px' }, 3000);

                 $('#panel').animate({ left: '1000px' }, 3000);
                 $('#panel').animate({ left: '200px' }, 3000);
                 $('#panel').animate({ left: '900px' }, 3000);
                 $('#panel').animate({ left: '250px' }, 3000);
                 $('#panel').animate({ left: '800px' }, 3000);
                 $('#panel').animate({ left: '300px' }, 3000);
                 $('#panel').animate({ left: '700px' }, 3000);
                 $('#panel').animate({ left: '350px' }, 3000);
                 $('#panel').animate({ left: '600px' }, 3000);
                 $('#panel').animate({ left: '400px' }, 3000);
                
            })
            $('#stop').click(function(){
                $('#panel').stop();
            })
        })
    </script>
</body>
</html>
