<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>

    <style>
        #click-me {
            max-width: 250px;
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            margin-bottom: 0;
        }
        #pannel {
            max-width: 250px;
            background-color: #352b2b;
            color: #fff;
            text-align: center;
            padding: 50px 0;
            margin-top: 0;
            display: none;
        }
    </style>
</head>
<body>
    
    <p id="click-me">Click Me</p>
    <p id="pannel">Hello Slider</p>

    <script>
        $(document).ready(function(){
            // $('#click-me').click(function(){
                // $('#pannel').slideDown();
            // })

            // $('#click-me').click(function () {
                // $('#pannel').slideUp(2000);
            // })

            $('#click-me').click(function () {
                $('#pannel').slideToggle(2000);
            })
        })
    </script>
</body>
</html>
