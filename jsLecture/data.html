<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <h1>Data Type </h1>

    <script>

        // string data type 
        // let name = "tee myal";
        let name = 'tee marn';
        console.log(name);
        console.log(typeof(name));


        // numberic data type 
        let age = 20;
        console.log(age);
        console.log(typeof(age));

        //  bollen data type (true & false)
        let isStudent = true;
        console.log(isStudent);
        console.log(typeof(isStudent));

        // undefined data type 
        let undefinedVariable;
        console.log(undefinedVariable);
        console.log(typeof(undefinedVariable));

        // null data type 
        let nullVariable = null;
        console.log(nullVariable);
        console.log(typeof(nullVariable));

        // array data type index start from 0
        // let studentList = new Array('mg mg', 'aung aung', 'myo myo');
        let studentList = ["ma ma", "mg mg", "aye aye"];

        console.log(studentList);
        console.log(typeof(studentList));
        console.log(studentList.length);
        console.log(studentList[2]);

        



    </script>
</body>
</html>
