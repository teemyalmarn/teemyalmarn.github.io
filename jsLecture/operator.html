<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    
    <h1>operator</h1>
    <script>

        // assign operatir 
        let name = "tee myal marn";
        console.log (name);

        // addition operator  +
        let number = 4 + 5;
        console.log (number);
        let fourFive = '4' + 5;
        console.log (fourFive);

        let number1 = 2000;
        let number2 = 1000;
        let number3 = number1 + number2;
        console.log (number3);
        
        let num = 10;
        // num = num + 1;
        num += 1;
        console.log (num);

        let numOne = 10;
        // numOne++;
        console.log (numOne++);
        console.log (numOne);

        // multiplication operator *
        let num4 = 4598;
        num4 += 787;
        console.log (num4);
        
        // division operator  /
        let num5 = 10;
        num5 /= 2;
        console.log (num5);

        // renaubder operator %
        let num6 = 547857;
        num6 %= 54654;
        console.log (num6);

        // exponent operator **
        const num7 = 2;
        const num8 = 6;
        const num9 = num7 ** num8;
        console.log (num9);

        
    </script>
