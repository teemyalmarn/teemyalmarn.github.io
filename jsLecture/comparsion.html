<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>comparsion</h1>

    <script>
        // greater than opetator >
        let num1 = '10';
        let num2 = 10;
        console.log (num1 > num2); //true false
        
        
        // greater than or equal to operator >=
        console.log (num1 >= num2);

        // less than operator <
        console.log (num1 < num2);


        // equal to operator == value
        console.log (num1 == num2);


        // equal to operator === type and value
        console.log (num1 === num2);

        // not equal to operator != value
        console.log (num1 != num2);

        // not equal to operator !== data type and value
        console.log (num1 !== num2);
    </script>
</body>
</html>
