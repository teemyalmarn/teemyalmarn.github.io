<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <h1>looping Lesson</h1>




    <!-- while loop  -->

   <script>


    let number = parseInt(prompt("Enter a number"));

    // while(condition){
        // code 
        // update 
    // }

        // 100 < 100
    while(number < 100){
        document.write('Your number is while loop $(number)<br>');

        number+= 10;
    }

    // do while loop 

    // do{
        // code 
        // update 
    // } while(condition)


    do{
        document.write('your number is do while loop ${number}<br>');

        number += 20;
    }while(number < 100);
   </script>
</body>
</html>
